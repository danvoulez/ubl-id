[package]
name = "ubl-id"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Universal Business Ledger identity primitives: DIDs (did:ubl:*), CIDs (cid:blake3:*), Wallets, and PoP headers. RFC-0001 compliant."
readme = "README.md"
repository = "https://github.com/danvoulez/ubl-id"
homepage = "https://id.ubl.agency"
documentation = "https://docs.rs/ubl-id"
keywords = ["did", "cid", "wallet", "dpop", "ed25519"]
categories = ["authentication", "cryptography", "web-programming"]
exclude = [".github/*", "target/*", ".gitignore"]

[features]
default = []
resolve = ["dep:ureq"]
full = ["resolve"]

[dependencies]
base64 = "0.22"
blake3 = "1.5"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
json_atomic = "0.1"
once_cell = "1.19"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
time = { version = "0.3", features = ["macros"] }
ureq = { version = "2.9", features = ["json"], optional = true }

[dev-dependencies]
rand_chacha = "0.3"
